name: Qwen paper trader with real market data
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/intelligence/**'
      - 'backend/app/paper*.py'
      - 'backend/app/llm/paper_schema.py'
      - '.github/workflows/intelligence-probe.yml'
permissions:
  contents: read
jobs:
  observed-market:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_NUM_THREAD: '4'
      OLLAMA_NUM_CTX: '8192'
      OLLAMA_THINK: 'false'
      OLLAMA_TIMEOUT_SECONDS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --locked
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/ollama.log"; exit 1; fi
          ollama pull qwen3:4b
      - name: Fetch market data, ask Qwen and replay paper execution
        shell: bash
        run: |
          set -o pipefail
          mkdir -p market-check
          uv run --locked python -m app.paper_market_check --output market-check 2>&1 | tee market-check/execution.log
      - name: Save market data provenance and diagnostics
        if: always()
        run: |
          mkdir -p market-check
          if [ -f "$RUNNER_TEMP/ollama.log" ]; then cp "$RUNNER_TEMP/ollama.log" market-check/ollama.log; fi
          if [ -f market-check/summary.md ]; then cat market-check/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observed-market-paper-check
          path: market-check/
          retention-days: 7
