name: Real Qwen intelligence probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/app/intelligence/**'
      - '.github/workflows/intelligence-probe.yml'
permissions:
  contents: read
jobs:
  grounded-probe:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_NUM_THREAD: '4'
      OLLAMA_NUM_CTX: '8192'
      OLLAMA_THINK: 'false'
      OLLAMA_TIMEOUT_SECONDS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv
      - run: uv sync --locked
      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat "$RUNNER_TEMP/ollama.log"; exit 1; fi
          ollama pull qwen3:4b
      - name: Research, decide, observe and learn
        shell: bash
        run: |
          set -o pipefail
          mkdir -p intelligence-probe
          uv run python -m app.intelligence.probe --network 2>&1 | tee intelligence-probe/execution.log
          cat intelligence-probe/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete evidence and model diagnostics
        if: always()
        run: |
          mkdir -p intelligence-probe
          if [ -f "$RUNNER_TEMP/ollama.log" ]; then cp "$RUNNER_TEMP/ollama.log" intelligence-probe/ollama.log; fi
          if [ -f intelligence-probe/fixture.sqlite3 ]; then
            python - <<'PY'
          import sqlite3
          db=sqlite3.connect('intelligence-probe/fixture.sqlite3')
          for row in db.execute("SELECT status,error,response FROM research_runs"):
              print(row)
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intelligence-probe
          path: intelligence-probe/
          retention-days: 7
