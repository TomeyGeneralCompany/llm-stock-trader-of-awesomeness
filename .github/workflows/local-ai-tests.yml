name: Local AI and stage gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  local-ai-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Verify local model, stage gates, and application features
        run: uv run pytest tests -q
