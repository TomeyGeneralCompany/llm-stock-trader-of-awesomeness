[project]
name = "llm-stock-backtesting-dashboard"
version = "0.1.0"
description = "Local AI stock backtesting and paper trading dashboard with a Next.js frontend and FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core dependencies
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "requests>=2.32.4",
    # Backend (FastAPI)
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.2",
    "filelock>=3.16.0",
    "threadpoolctl>=3.6.0",
    # Stock Data
    "yfinance>=0.2.18",
    "scipy>=1.11.4",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=0.21.1",
    "ruff>=0.12.0",
    "pyright>=1.1.402",
    "black>=23.11.0",
    "mypy>=1.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "frontend"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
